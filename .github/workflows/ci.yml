name: CI

on:
  pull_request:
    # `edited`: al cambiar la descripción del PR vuelve a correr todo (el job `plan-pr` la lee y
    # `ci-ok` tiene que reflejarla). Corre todo, y no solo `plan-pr`, porque la corrida nueva
    # cancela la anterior (concurrency) y `ci-ok` sale de una sola corrida.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# En un PR, un push nuevo (o editar la descripción) cancela la corrida anterior. En `main` no: cada
# corrida de main termina, porque guarda las cachés que leen los PRs (vitest, la base sembrada).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ¿El PR toca solo documentación? Entonces no hace falta correr tests, build ni E2E: alcanza con
  # el chequeo de formato (job `docs`). En `main` (push) corre todo siempre. «Solo documentación» =
  # cada archivo cambiado está en docs/, es un .md de la raíz o está en .claude/ (skills, notas).
  # Nada de eso lo importa el sitio ni lo leen los tests.
  # Y `e2e`: false si el PR no puede cambiar lo que recorre Playwright (ver el paso «¿Hace falta E2E?»).
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
      e2e: ${{ steps.e2e.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El merge del PR y su primer padre (la base del PR), para comparar con HEAD^1.
          fetch-depth: 2

      - name: ¿Solo documentación?
        id: check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^docs/|^[^/]+\.md$|^\.claude/'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Solo documentación: corre el chequeo de formato y se saltean tests, build y E2E." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      # E2E (build + Worker + Playwright) se saltea si TODOS los archivos del PR son de los que el
      # sitio construido no usa: documentación, pruebas unitarias (*.test.js, no tests/ de
      # Playwright) y herramientas de la CI que no entran al build (sequencer de vitest, hooks de
      # agentes, ui-impacto). Todo lo demás (src/, migrations/, scripts/ en general, tests/,
      # package*.json, wrangler.toml, worker/, workflows...) corre E2E. En `main`, siempre.
      - name: ¿Hace falta E2E?
        id: e2e
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^docs/|^[^/]+\.md$|^\.claude/|^(src|scripts)/.*\.test\.js$|^scripts/vitest/|^scripts/hooks/|^scripts/ui-impacto/'; then
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "El PR no toca nada que use el sitio construido: se saltea E2E." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi

  # Para los PRs de solo documentación: el mismo chequeo de formato que `unit`, nada más.
  docs:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

  # Lint y formato (unit), las pruebas en 3 partes (tests), build + E2E y tipos corren en paralelo.
  unit:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Respeta .prettierignore (los posts del CMS y los archivos de la lista temporal quedan afuera).
      # Si falla: `npm run format` y commiteá el resultado.
      - name: Prettier
        run: npm run format:check

  # Las pruebas de vitest, repartidas en 4 máquinas en paralelo (con 3, la parte más lenta era el
  # camino crítico de `ci-ok`). Cada una corre un cuarto de los archivos (`--shard`); juntas, todas.
  tests:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: tests (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Cachés de vitest entre corridas (después de `npm ci`, que borra node_modules):
      # node_modules/.vite/vitest guarda cuánto tardó cada archivo la última vez (los lentos
      # arrancan primero) y node_modules/.vitest-cache los módulos ya transformados
      # (`--fsModuleCache`; vitest la vacía sola si cambia package-lock.json). Una por parte: cada
      # parte corre siempre más o menos los mismos archivos. Los PRs leen la de main; solo main la
      # guarda (si cada PR guardara la suya, llenarían los 10 GB de caché del repo y GitHub borraría
      # las de npm y Chromium).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: vitest-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('package-lock.json') }}-

      # El reparto entre las 4 partes es por tiempo (scripts/vitest/sequencer.js, con los tiempos de
      # scripts/vitest/durations.json), no por cantidad de archivos. Cada parte guarda cuánto tardó
      # cada archivo y lo sube como artifact `vitest-durations-N`, para actualizar durations.json
      # (scripts/vitest/merge-durations.js).
      - name: Unit + content tests
        run: npx vitest run --shard=${{ matrix.shard }}/4 --fsModuleCache --reporter=default --reporter=./scripts/vitest/durations-reporter.js
        env:
          VITEST_DURATIONS_OUT: ${{ runner.temp }}/vitest-durations.json

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest-cache
          key: vitest-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

      # Los tiempos sirven de una corrida de main (scripts/vitest/merge-durations.js).
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.event_name == 'push'
        with:
          name: vitest-durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/vitest-durations.json
          retention-days: 30

  # Build, Worker empaquetado y pruebas de humo de Playwright. Lo más lento era cargar la semilla en
  # una base local nueva (~1,5 minutos): ahora la base sembrada se guarda en caché (ver abajo) y, si
  # no está, se siembra al mismo tiempo que el build y que la instalación de Chromium.
  # Se saltea en los PRs que no tocan nada del sitio construido (job `changes`, output `e2e`).
  e2e:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.e2e != 'false'
    # 22.04: @playwright/test 1.40 can't install system deps on 24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # The browser only changes when @playwright/test does: keep it between runs.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      # La base local ya sembrada (.wrangler/state), por lo que la arma: migraciones, la semilla y
      # el código que la carga (scripts/semilla.js importa de src/lib/server y src/lib/utils), sin
      # las pruebas. Clave exacta, sin restore-keys: una base de otra versión no sirve. Se guarda
      # apenas se siembra (abajo), antes de que las pruebas escriban en ella.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: seed-cache
        with:
          path: .wrangler/state
          key: semilla-${{ runner.os }}-${{ hashFiles('migrations/**', 'src/lib/server/**/*.js', 'src/lib/server/semilla/*.json', 'src/lib/utils/**/*.js', 'src/lib/*.js', '!**/*.test.js', 'scripts/semilla.js', 'scripts/local-d1.js', 'wrangler.toml', 'package-lock.json') }}

      # En paralelo: la semilla si no vino de la caché (scripts/semilla.js: migraciones + contenido
      # público en .wrangler/state; Playwright la vuelve a correr antes de servir, sobre la base ya
      # cargada, y tarda segundos), Chromium (scripts/chromium-ci.sh: sus librerías del sistema
      # solo si falta alguna) y el build. Si algo falla, muestra su log.
      - name: Build + seed + Chromium
        env:
          SEED_CACHE_HIT: ${{ steps.seed-cache.outputs.cache-hit }}
        run: |
          if [ "$SEED_CACHE_HIT" = 'true' ]; then
            echo "Base sembrada de la caché." > "$RUNNER_TEMP/semilla.log"
            seed=''
          else
            node scripts/semilla.js --quiet > "$RUNNER_TEMP/semilla.log" 2>&1 &
            seed=$!
          fi
          bash scripts/chromium-ci.sh > "$RUNNER_TEMP/chromium.log" 2>&1 &
          chromium=$!
          npm run build
          if ! wait "$chromium"; then cat "$RUNNER_TEMP/chromium.log"; exit 1; fi
          tail -n 3 "$RUNNER_TEMP/chromium.log"
          if [ -n "$seed" ] && ! wait "$seed"; then cat "$RUNNER_TEMP/semilla.log"; exit 1; fi
          cat "$RUNNER_TEMP/semilla.log"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.seed-cache.outputs.cache-hit != 'true'
        with:
          path: .wrangler/state
          key: ${{ steps.seed-cache.outputs.cache-primary-key }}

      # Empaqueta el Worker (worker/index.js + el build) como lo haría el deploy, sin subir nada
      # ni necesitar cuenta de Cloudflare.
      - name: Worker bundle (wrangler dry-run)
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      # Este build no tiene rama de deploy, como producción para el modo demo (PREVIEW_BUILD es
      # false): el seed y el botón «Recargar datos de prueba» no pueden estar en el Worker.
      - name: No demo seed in the production bundle
        run: node scripts/demo/guard.js bundle .wrangler/dry-run/index.js

      - name: E2E smoke tests
        run: npx playwright test
        env:
          PW_NO_BUILD: '1'

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Fails only if svelte-check reports MORE errors than scripts/svelte-check-baseline.json.
  # Its log lists every current error.
  typecheck:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: svelte-check ratchet
        run: node scripts/svelte-check-ratchet.js

  # Informe de impacto visual (docs/ui-impacto.md): capturas de las páginas principales en la base
  # del PR y en el PR, comparadas. Es SOLO INFORMATIVO: no está en los `needs` de ci-ok y lleva
  # `continue-on-error: true` (la única excepción a la regla de nunca usarlo: no es una prueba, es
  # un informe para mirar antes de aprobar un cambio de diseño). Corre solo si el PR toca estilos o
  # componentes (o la herramienta misma, scripts/ui-impacto/); el informe queda como artifact
  # `ui-impacto` y el resumen en la página de la corrida.
  ui-impacto:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El merge del PR y su primer padre (la base del PR), para --base HEAD^1.
          fetch-depth: 2

      - name: ¿Toca estilos o componentes?
        id: changes
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^src/.*\.(svelte|scss|css)$|^src/lib/styles/|^src/lib/components/|^scripts/ui-impacto/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en estilos ni componentes: no hace falta el informe de impacto visual." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
        if: steps.changes.outputs.run == 'true'

      - name: Playwright version
        if: steps.changes.outputs.run == 'true'
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changes.outputs.run == 'true'
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      # Sus librerías del sistema solo si falta alguna (apt a veces tarda más de 9 minutos).
      - name: Chromium
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/chromium-ci.sh

      - name: Impacto visual
        if: steps.changes.outputs.run == 'true'
        run: npm run ui:impacto -- --base HEAD^1
        env:
          UI_IMPACTO_ARTIFACT_NOTE: 'El informe completo (base | nuevo | diferencias) está en el artifact **ui-impacto** de esta corrida: bajalo, descomprimilo y abrí `index.html`.'

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && steps.changes.outputs.run == 'true'
        with:
          name: ui-impacto
          path: ui-impacto/
          retention-days: 14

  # docs/plan.md, el plan único: ids, fases, estados, dependencias y que las fases de
  # src/lib/admin/nav.js coincidan (scripts/plan-lint.js). Sin dependencias: no hace falta npm ci.
  # Corre también en los PRs de solo documentación.
  # Y migrations/ append-only (scripts/migrations-lint.js): ninguna migración de la base cambia,
  # se borra o se renombra, y no hay dos con el mismo número. Compara el merge del PR (o el push a
  # main) con su primer padre, por eso `fetch-depth: 2`.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - run: node scripts/plan-lint.js

      - name: Migraciones append-only
        run: node scripts/migrations-lint.js --base HEAD^1

  # La descripción del PR dice a qué ítems del plan corresponde: una línea `Plan: <id>[, <id>]` o
  # `Plan: ninguno`, con ids que existen en el docs/plan.md del PR (scripts/plan-pr.js). Los PRs de
  # bots no la necesitan. Solo en pull_request (en `main` se saltea).
  plan-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - run: node scripts/plan-pr.js

  # The single check to require in branch protection. It passes only if every job it needs
  # succeeded (or was skipped), so jobs can be added or renamed without touching the settings.
  # When you add a job above, add it to `needs` here too.
  ci-ok:
    if: always()
    needs: [changes, docs, unit, tests, e2e, typecheck, plan, plan-pr]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required job ended as '$r'."; exit 1 ;;
            esac
          done
