name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # 22.04: @playwright/test 1.40 can't install system deps on 24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit + content tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # Empaqueta el Worker (worker/index.js + el build) como lo haría el deploy, sin subir nada
      # ni necesitar cuenta de Cloudflare.
      - name: Worker bundle (wrangler dry-run)
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npx playwright test
        env:
          PW_NO_BUILD: '1'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Fails only if svelte-check reports MORE errors than scripts/svelte-check-baseline.json.
  # Its log lists every current error.
  typecheck:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: svelte-check ratchet
        run: node scripts/svelte-check-ratchet.js

  # The single check to require in branch protection. It passes only if every job it needs
  # succeeded (or was skipped), so jobs can be added or renamed without touching the settings.
  # When you add a job above, add it to `needs` here too.
  ci-ok:
    if: always()
    needs: [test, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required job ended as '$r'."; exit 1 ;;
            esac
          done
