<!doctype html>
<!--
	Las tarjetas de la vista previa al compartir un link (1200 × 630): la por defecto y una por
	sección. No se abre a mano: `node scripts/og-default/render.js` la carga una vez por tarjeta con
	`?section=<nombre>&tagline=<frase>` (los textos salen de src/lib/utils/ogCards.js) y guarda cada
	PNG en static/ (ver docs/compartir.md). Colores y tipografía: los del sitio
	(src/lib/styles/style.scss: --1, --2, --3, --1-tint, Lato). Fondo plano: el PNG pesa poco.
-->
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'Lato';
				font-weight: 400;
				src: url('../../src/lib/styles/fonts/lato-latin-400-normal.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Lato';
				font-weight: 700;
				src: url('../../src/lib/styles/fonts/lato-latin-700-normal.woff2') format('woff2');
			}
			:root {
				--1: hsl(319, 90%, 60%);
				--2: hsl(262, 90%, 60%);
				--3: hsl(165, 84%, 45%);
				--1-tint: hsl(319, 100%, 95%);
			}
			html,
			body {
				margin: 0;
			}
			.card {
				box-sizing: border-box;
				width: 1200px;
				height: 630px;
				display: flex;
				align-items: center;
				gap: 64px;
				padding: 0 80px;
				background: var(--2);
				color: white;
				font-family: 'Lato', sans-serif;
				overflow: hidden;
			}
			/* el círculo del logo no llega al borde del PNG: se agranda un poco y se recorta en
			   redondo, así no queda un anillo claro alrededor */
			.logo {
				flex: none;
				width: 360px;
				height: 360px;
				border-radius: 50%;
				overflow: hidden;
			}
			.logo img {
				display: block;
				width: 100%;
				height: 100%;
				transform: scale(1.06);
			}
			.text {
				flex: 1;
				min-width: 0;
				display: flex;
				flex-direction: column;
				gap: 24px;
			}
			h1 {
				margin: 0;
				font-size: 92px;
				font-weight: 700;
				line-height: 1;
				color: white;
			}
			h1:empty {
				display: none;
			}
			/* la frase se achica sola hasta entrar (render.js); arranca grande para una o dos líneas */
			p {
				margin: 0;
				font-size: 52px;
				font-weight: 700;
				line-height: 1.2;
				color: var(--1-tint);
				text-wrap: balance;
			}
			.with-section p {
				font-weight: 400;
			}
			.site {
				align-self: flex-start;
				padding: 10px 26px;
				border-radius: 999px;
				background: var(--3);
				color: hsl(165 84% 12%);
				font-size: 30px;
				font-weight: 700;
			}
		</style>
	</head>
	<body>
		<main class="card">
			<div class="logo"><img src="../../static/android-chrome-512x512.png" alt="" /></div>
			<div class="text">
				<h1 id="section"></h1>
				<p id="tagline"></p>
				<span class="site">kinkyvibe.ar</span>
			</div>
		</main>
		<script>
			// Los textos llegan por la dirección; textContent, nunca HTML.
			const params = new URLSearchParams(location.search);
			const section = params.get('section') ?? '';
			document.getElementById('section').textContent = section;
			document.getElementById('tagline').textContent = params.get('tagline') ?? '';
			if (section) document.querySelector('.card').classList.add('with-section');
		</script>
	</body>
</html>
