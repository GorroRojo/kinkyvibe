<!doctype html>
<!--
	La imagen por defecto de la vista previa al compartir un link (1200 × 630): la que usan las
	páginas sin imagen propia. Se renderiza con `node scripts/og-default/render.js` a
	static/og-default.png (ver docs/compartir.md). Colores y tipografía: los del sitio
	(src/lib/styles/style.scss: --1, --2, --3, --1-tint, Lato).
-->
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'Lato';
				font-weight: 400;
				src: url('../../src/lib/styles/fonts/lato-latin-400-normal.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Lato';
				font-weight: 700;
				src: url('../../src/lib/styles/fonts/lato-latin-700-normal.woff2') format('woff2');
			}
			:root {
				--1: hsl(319, 90%, 60%);
				--2: hsl(262, 90%, 60%);
				--3: hsl(165, 84%, 45%);
				--1-tint: hsl(319, 100%, 95%);
			}
			html,
			body {
				margin: 0;
			}
			.card {
				box-sizing: border-box;
				width: 1200px;
				height: 630px;
				display: flex;
				align-items: center;
				gap: 64px;
				padding: 0 88px;
				/* colores planos (como las piezas de KinkyVibe): un PNG liviano, sin degradés */
				background: var(--2);
				color: white;
				font-family: 'Lato', sans-serif;
				position: relative;
				overflow: hidden;
			}
			/* el círculo del logo no llega al borde del PNG: se agranda un poco y se recorta en
			   redondo, así no queda un anillo claro alrededor */
			.logo {
				flex: none;
				width: 380px;
				height: 380px;
				border-radius: 50%;
				overflow: hidden;
			}
			.logo img {
				display: block;
				width: 100%;
				height: 100%;
				transform: scale(1.06);
			}
			.text {
				display: flex;
				flex-direction: column;
				gap: 22px;
			}
			h1 {
				margin: 0;
				font-size: 104px;
				font-weight: 700;
				line-height: 0.95;
				letter-spacing: -1px;
			}
			p {
				margin: 0;
				font-size: 34px;
				font-weight: 400;
				line-height: 1.3;
				color: var(--1-tint);
				max-width: 560px;
			}
			.site {
				align-self: flex-start;
				margin-top: 10px;
				padding: 10px 26px;
				border-radius: 999px;
				background: var(--3);
				color: hsl(165 84% 12%);
				font-size: 30px;
				font-weight: 700;
			}
		</style>
	</head>
	<body>
		<main class="card">
			<div class="logo"><img src="../../static/android-chrome-512x512.png" alt="" /></div>
			<div class="text">
				<h1>Kinky Vibe</h1>
				<!-- De la descripción del inicio (src/routes/(content)/+page.svelte). -->
				<p>Información y encuentros cuir LGTBQIA+ kinky y de BDSM.</p>
				<span class="site">kinkyvibe.ar</span>
			</div>
		</main>
	</body>
</html>
