# Configuración del Worker `kinkyvibe` (Cloudflare Workers con archivos estáticos). Cómo se
# migró desde Cloudflare Pages y qué hay en el panel: docs/workers-migracion.md.
#
# Lo usan Workers Builds (deploy de producción y Previews) y wrangler en local (`npm run dev`,
# tests, `wrangler d1 …`). No tiene `pages_build_output_dir` a propósito (ver CLAUDE.md).
#
# Los ids de las bases D1 no son secretos. NUNCA escribirlos a mano: copiarlos de
# `npx wrangler d1 list --json` y comparar (ver CLAUDE.md).
name = "kinkyvibe"
main = "worker/index.js"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]

# Producción se sirve solo en kinkyvibe.ar (Custom Domain del Worker). La URL
# kinkyvibe.<subdominio>.workers.dev servía para probar antes de mover el dominio; abierta, era
# una segunda puerta pública a producción (sin los ajustes de la zona kinkyvibe.ar), así que va
# apagada. Apagarla NO apaga los Previews de cada rama (<rama>-kinkyvibe.<subdominio>.workers.dev)
# ni las Version URLs: esas dependen de `preview_urls`, que tiene que quedar en `true` explícito
# (si se borra, Wrangler ≥ 4.44 lo iguala a `workers_dev` y se apagarían también).
# Docs: https://developers.cloudflare.com/workers/configuration/routing/workers-dev/
workers_dev = false
preview_urls = true

# Las variables de texto se cargan en el panel (Settings → Variables and Secrets). Sin esto,
# cada deploy borraría las que no estén en este archivo. Los secrets nunca se borran.
keep_vars = true

# Sin `[cache]` (Workers Cache) a propósito: cobra los archivos estáticos, que hoy son gratis, y no
# mira las cookies (le daría la página anónima a quien tiene sesión). Ver docs/workers-migracion.md,
# «No prender Workers Cache».

# Tope de CPU por invocación (pedidos y crons): 15 s en vez de los 30 s por defecto. Es un freno de
# costo contra un pedido que se cuelga en un bucle, no de velocidad. Medido en local con la semilla
# (27/10/2026): el cron nocturno entero (backup + integridad) ~1 s de pared y `/og` 1,2–3 s; en
# producción la base es unas 5 veces la semilla. Ver docs/workers-migracion.md, «Tope de CPU».
[limits]
cpu_ms = 15000

# Los archivos que genera el adapter de SvelteKit (ver wrangler.adapter.toml).
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[observability]
enabled = true

# Ubicación del Worker (docs/workers-migracion.md, «Ubicación del Worker»): sin `[placement]`, a
# propósito. El Worker corre en el centro de datos de quien visita: la caché de 1 minuto responde
# desde ahí y las páginas livianas tardan menos. Se midió desde Buenos Aires el 25/10 contra la
# región fija `aws:us-east-1` (al lado de la base): 6 de 8 páginas más rápidas, una igual y la del
# evento ~0,08 s más lenta, porque todavía hace varias idas en fila a la base (decisión de gorrite).
# Las consultas van en tanda (src/lib/server/db/autoBatch.js) para que cada página cruce a la base
# las menos veces posible. Para volver a la región fija: `[placement]` + `region = "aws:us-east-1"`.

# Crons (UTC). Tienen que coincidir con src/lib/server/scheduled.js (lo verifica un test).
# - cada 15 minutos: recordatorios de entradas;
# - 06:00 UTC (03:00 en Argentina): backup de la base a R2 y copia de la biblioteca.
# Solo corren en producción (los Previews no ejecutan crons).
[triggers]
crons = ["*/15 * * * *", "0 6 * * *"]

# Base de datos D1 de producción. En local (`npm run dev`, tests) es una copia simulada por
# miniflare en `.wrangler/state`: nunca se conecta a Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "kinkyvibe"
database_id = "e3fd96b8-5655-4eee-937e-3bf6785b8d38"
migrations_dir = "migrations"

# Backups nocturnos de la base (src/lib/server/backup/). El bucket se crea a mano una vez.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "kinkyvibe-backups"

# Visitas anónimas (docs/analiticas.md): Workers Analytics Engine. El dataset se crea solo con
# el primer dato. Nada de IPs, cookies ni cuentas. Los Previews no tienen este binding (el código
# no hace nada sin él), así las pruebas no ensucian las visitas de producción.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "kinkyvibe_visitas"

# Imágenes del sitio (docs/imagenes.md): las sube el panel y se sirven en /media/<clave>. El bucket
# se creó a mano una vez.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kinkyvibe-media"

# Copia de la biblioteca (docs/imagenes.md, «Copia de la biblioteca»): el cron nocturno copia ahí lo
# nuevo de `img/` y `file/` y nunca borra nada. Solo producción: los Previews no tienen este binding
# (y no corren crons). El bucket se crea a mano una vez, antes de publicar esto.
[[r2_buckets]]
binding = "MEDIA_COPIA"
bucket_name = "kinkyvibe-media-copia"

# Transformaciones de imágenes de Cloudflare (docs/compartir.md): las miniaturas de las portadas
# del collage de las imágenes de vista previa (`/og/…`). Cada miniatura distinta cuenta una vez
# por mes en el cupo gratis de 5000. Las imágenes ya dibujadas se guardan en R2 (`og/…` en MEDIA).
[images]
binding = "IMAGES"

# Previews (una por rama que no sea main): no heredan nada de producción. Usan la base de
# prueba y el bucket de imágenes de prueba, y no tienen bucket de backups. Los secrets se cargan
# en el panel, en «Previews Base»; las variables de texto van acá (si no, cada deploy las pisa).
[previews]

[previews.vars]
# A quién le llegan los mails de los previews (docs/mails.md, emailGuard.js).
EMAIL_ALLOWLIST = "gorro.rojo@gmail.com"
# App de GitHub de prueba (el client id no es secreto: aparece en el link de ingreso).
GITHUB_CLIENT_ID = "aea641478a2f62ca687a"
# Vacío a propósito: en un preview los links tienen que apuntar al preview (el código usa el
# origen del pedido si SITE_URL está vacío). Pisa un SITE_URL viejo cargado en el panel.
SITE_URL = ""

[[previews.d1_databases]]
binding = "DB"
database_name = "kinkyvibe-preview"
database_id = "c7513f19-d6a1-467c-b694-3c0559675b9d"
migrations_dir = "migrations"

[[previews.r2_buckets]]
binding = "MEDIA"
bucket_name = "kinkyvibe-media-preview"

[previews.images]
binding = "IMAGES"
