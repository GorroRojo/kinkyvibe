<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		<meta name="robots" content="noindex" />
		<title>Se nos enredaron las cuerdas · KinkyVibe</title>
		<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet" />
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 2rem 1rem;
				box-sizing: border-box;
				background: #eee;
				color: #333;
				font-family: 'Lato', sans-serif;
			}
			main {
				max-width: 32rem;
				background: white;
				border-radius: 1rem;
				border-top: 0.4rem solid hsl(319, 90%, 60%);
				box-shadow: 0 0 0.3em 0.2em rgba(0, 0, 0, 0.05);
				padding: 2rem 1.5rem;
				text-align: center;
			}
			.emoji {
				font-size: 4rem;
				line-height: 1;
			}
			.status {
				margin: 0.75rem 0 0;
				font-size: 0.9rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: hsl(262, 90%, 50%);
			}
			h1 {
				margin: 0.3em 0 0.4em;
				font-size: 2rem;
				color: #222;
			}
			p {
				line-height: 1.5;
			}
			a {
				display: inline-block;
				margin-top: 1rem;
				padding: 0.6em 1.3em;
				border-radius: 3em;
				background: hsl(262, 90%, 60%);
				color: white;
				font-weight: bold;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="emoji" aria-hidden="true">🪢😵‍💫</div>
			<p class="status">Error %sveltekit.status%</p>
			<h1>Se nos enredaron las cuerdas</h1>
			<p>
				Va a llevarme un tiempo desarmar pero decime si necesitás que use las tijeras de seguridad.
			</p>
			<a href="/">Ir al inicio</a>
		</main>
	</body>
</html>
